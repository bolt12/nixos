name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full `nix flake check` (builds ninho + bolt-nixos toplevels)"
        type: boolean
        default: false

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Eval-only: fast, doesn't pull the world. Catches type errors,
      # missing imports, broken option references, syntax issues.
      #
      # We eval the two deployed toplevels directly rather than
      # `nix flake check --no-build`: that flag forbids the small IFD build
      # Stylix's base16 scheme needs (bolt-nixos), so it fails on an
      # otherwise-valid config. `nix eval` permits that IFD build while still
      # not building the toplevels themselves.
      - name: nix eval nixos toplevels
        run: |
          nix eval --show-trace .#nixosConfigurations.ninho-nixos.config.system.build.toplevel.drvPath
          nix eval --show-trace .#nixosConfigurations.bolt-nixos.config.system.build.toplevel.drvPath
          # hetzner is public-facing; the standalone HM configs (esp. bolt-with-de)
          # are not covered by nix flake check. Eval them here so a regression in
          # any of them fails CI. bolt-x200 is a known stub (no root fs), skipped.
          nix eval --show-trace .#nixosConfigurations.hetzner.config.system.build.toplevel.drvPath
          nix eval --show-trace .#homeConfigurations.bolt.activationPackage.drvPath
          nix eval --show-trace .#homeConfigurations.bolt-with-de.activationPackage.drvPath
          nix eval --show-trace .#homeConfigurations.pollard.activationPackage.drvPath
          nix eval --show-trace .#homeConfigurations.steam-deck.activationPackage.drvPath

      - name: nix fmt --check
        run: nix fmt -- --check .

  build:
    name: Build full closures
    needs: evaluate
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake check (full build)
        run: nix flake check --show-trace
