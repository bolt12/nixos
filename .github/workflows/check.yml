name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full `nix flake check` (builds ninho + bolt-nixos toplevels)"
        type: boolean
        default: false

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Eval-only — fast, doesn't pull the world. Catches type errors,
      # missing imports, broken option references, syntax issues.
      - name: nix flake check (eval-only)
        run: nix flake check --no-build --show-trace

      - name: nix fmt --check
        run: nix fmt -- --check .

  build:
    name: Build full closures
    needs: evaluate
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake check (full build)
        run: nix flake check --show-trace
